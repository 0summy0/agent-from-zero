name: schedule-daily

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  HF_ENDPOINT: https://hf-mirror.com
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  dependency-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ${{ github.workspace }}/.cache/huggingface
          key: ${{ runner.os }}-daily-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-daily-
      - id: drift
        continue-on-error: true
        name: Test upgraded dependencies in temporary directory
        run: |
          workdir="$(mktemp -d)"
          cp pyproject.toml uv.lock README.md .python-version "$workdir/"
          cp -r chapters docs quizzes tests tools src "$workdir/"
          cd "$workdir"
          uv lock --upgrade
          uv sync --frozen
          uv run pytest
      - name: Report dependency drift without duplicating issues
        if: steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily dependency drift failed"
          body="The temporary upgraded lockfile failed the smoke tests. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} for the logs. The repository lockfile was not changed."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
