name: quality

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - src/**
      - chapters/**
      - tests/**
      - tools/**
      - .github/workflows/quality.yml
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - src/**
      - chapters/**
      - tests/**
      - tools/**
      - .github/workflows/quality.yml
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
