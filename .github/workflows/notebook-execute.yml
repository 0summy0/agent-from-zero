name: notebook-execute

on:
  push:
    paths:
      - pyproject.toml
      - uv.lock
      - chapters/**
      - docs/**
      - quizzes/**
      - tests/**
      - tools/**
      - .python-version
      - .github/workflows/**
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - chapters/**
      - docs/**
      - quizzes/**
      - tests/**
      - tools/**
      - .python-version
      - .github/workflows/**
  workflow_dispatch:

env:
  HF_ENDPOINT: https://hf-mirror.com
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ${{ github.workspace }}/.cache/huggingface
          key: ${{ runner.os }}-notebook-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-notebook-
      - run: uv sync --frozen
      - if: hashFiles('**/*.ipynb') != ''
        run: uv run pytest --nbval-lax .
