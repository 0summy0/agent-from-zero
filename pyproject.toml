[project]
name = "agent-from-zero"
version = "1.1.0"
description = "Bilingual zero-GPU AI Agent course with executable chapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "tokenizers>=0.21.0,<0.23",
]

[project.scripts]
agent-from-zero = "agent_from_zero:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "nbval>=0.11.0,<0.12",
    "pytest>=9.2.0,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
markers = [
    "requires_gpu: needs CUDA",
    "requires_network: needs outbound net",
    "requires_api_key: needs a paid key",
    "slow: >60s",
]
addopts = '-q -m "not requires_gpu and not requires_api_key and not slow"'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
